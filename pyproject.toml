[project]
name = "acme-ap"
version = "0.1.0"
description = "Multi-agent invoice processing for Acme Corp — Galatiq FDE case"
readme = "README.md"
authors = [
    { name = "travelinman1013", email = "max_erlich@me.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain>=1.0",
    "langchain-openai>=1.6",
    "pydantic>=2.11",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
    "typer>=0.20",
    "rich>=14",
    "python-dotenv>=1.1",
]

[project.scripts]
acme-ap = "acme_ap.cli:app"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.14",
]
ui = [
    "streamlit>=1.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a configured model provider (skipped when LLM_PROVIDER=none)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
